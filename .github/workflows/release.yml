name: Build & Release Electron App

on:
  push:
    # branches:
    #   - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app And Publish
        run: |
          npm run build
          npx electron-builder -c electron-builder.config.mjs --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}